[project]
name = "iopaint"
version = "2.1.1"
description = "Image inpainting, outpainting tool powered by SOTA AI Model"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "PanicByte", email = "cwq1913@gmail.com" },
]
keywords = ["inpainting", "outpainting", "stable-diffusion", "image-editing"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "opencv-python>=4.11.0.86",
    "diffusers>=0.27.2",
    "huggingface_hub>=0.25.2",
    "accelerate>=1.15.0",
    "peft>=0.7.1",
    "transformers>=4.39.1",
    "safetensors>=0.8.0",
    "controlnet-aux>=0.0.3",
    "fastapi>=0.108.0",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
    "python-socketio>=5.7.2",
    "typer>=0.27.2",
    "pydantic>=2.5.2",
    "rich>=15.0.0",
    "loguru>=0.7.3",
    "yacs>=0.1.8",
    "piexif>=1.1.3",
    "omegaconf>=2.3.1",
    "easydict>=1.13",
    "gradio>=4.21.0",
    "typer-config>=1.4.0",
    "Pillow>=10.4.0",
]

[project.urls]
Homepage = "https://github.com/Sanster/IOPaint"
Repository = "https://github.com/Sanster/IOPaint"
Documentation = "https://www.iopaint.com"

[project.scripts]
iopaint = "iopaint:entry_point"

[dependency-groups]
dev = [
    "wheel",
    "twine",
    "pytest-loguru",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Recursively discover all subpackages under iopaint/
packages.find.where = ["."]
packages.find.include = ["iopaint*"]

[tool.setuptools.package-data]
"iopaint.model.original_sd_configs" = ["*.yaml"]
"iopaint.model.anytext" = ["*.yaml"]
"iopaint.model.anytext.ocr_recog" = ["*.txt"]
"iopaint.web_app" = ["index.html", "favicon.ico", "assets/*"]

[tool.pyright]
# Type checking strategy: only enforce strict typing on first-party code we own.
# Vendored third-party model code (ControlNet, BrushNet, PowerPaint, BriARMBG,
# Segment Anything, AnyText) keeps upstream types untouched.
include = ["iopaint/__init__.py", "iopaint/api.py", "iopaint/cli.py",
           "iopaint/benchmark.py", "iopaint/download.py", "iopaint/file_manager",
           "iopaint/helper.py", "iopaint/installer.py", "iopaint/model_manager.py",
           "iopaint/runtime.py", "iopaint/schema.py", "iopaint/web_config.py"]
exclude = ["iopaint/model", "iopaint/plugins/anime_seg.py",
           "iopaint/plugins/base_plugin.py",
           "iopaint/plugins/basicsr", "iopaint/plugins/briarmbg*",
           "iopaint/plugins/facexlib", "iopaint/plugins/gfpgan",
           "iopaint/plugins/gfpgan_plugin.py", "iopaint/plugins/gfpganer.py",
           "iopaint/plugins/interactive_seg.py",
           "iopaint/plugins/realesrgan.py", "iopaint/plugins/remove_bg.py",
           "iopaint/plugins/restoreformer.py",
           "iopaint/plugins/segment_anything",
           "iopaint/plugins/segment_anything2", "iopaint/tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# Strategy: only enforce strict linting on first-party code. Vendored
# third-party model code keeps upstream style untouched.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort (import sort)
    "B",    # flake8-bugbear
    "UP",   # pyupgrade (Python version migration)
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
]
ignore = [
