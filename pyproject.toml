[tool.ruff.lint.per-file-ignores]
# Vendored third-party model code: keep upstream style untouched.
"iopaint/model/**" = ["ALL"]
"iopaint/plugins/anime_seg.py" = ["ALL"]
"iopaint/plugins/basicsr/**" = ["ALL"]
"iopaint/plugins/briarmbg*.py" = ["ALL"]
"iopaint/plugins/facexlib/**" = ["ALL"]
"iopaint/plugins/gfpgan/**" = ["ALL"]
"iopaint/plugins/gfpgan_plugin.py" = ["ALL"]
"iopaint/plugins/gfpganer.py" = ["ALL"]
"iopaint/plugins/interactive_seg.py" = ["ALL"]
"iopaint/plugins/realesrgan.py" = ["ALL"]
"iopaint/plugins/remove_bg.py" = ["ALL"]
"iopaint/plugins/restoreformer.py" = ["ALL"]
"iopaint/plugins/segment_anything/**" = ["ALL"]
"iopaint/plugins/segment_anything2/**" = ["ALL"]

# Tests: lower bar, focus on correctness.
"iopaint/tests/**" = [
    "E402",  # module level import not at top
    "F401",  # unused import (re-exports)
    "F811",  # redefined
    "F841",  # unused variable
    "ARG",   # unused arguments
]